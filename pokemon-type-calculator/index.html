<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="타입 상성">
<meta name="theme-color" content="#f6f5f2">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/tksehd2/muse-web-apps@main/pokemon-type-calculator/icon-ball-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>포켓몬 타입 상성 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0efe9; --line:#e2ded2;
    --text:#1a1a18; --muted:#55534d; --faint:#7d7b72;
    --red:#b42318;
    --warn:#d9480f;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131311; --surface:#1e1e1b; --surface2:#262622; --line:#3a392f; --text:#f2f1ec; --muted:#b3b1a6; --faint:#8a897e; --red:#fda29b; --warn:#ffa94d; --shadow:0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation}
  button{font-family:inherit;cursor:pointer;min-height:44px;touch-action:manipulation}
  .wrap{max-width:760px;margin:0 auto;height:100dvh;height:100svh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}

  /* pages */
  .page{display:none;flex:1;flex-direction:column;min-height:0}
  .page.active{display:flex}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .head-text{display:flex;flex-direction:column;min-width:0}
  .page-head h1,.page-head h2{font-size:22px;line-height:1.3;font-weight:900;letter-spacing:-.02em;margin:0}
  .foot-note{font-size:13px;color:var(--muted);line-height:1.55;margin:0 2px;padding-top:3px;height:24px;text-align:left;flex-shrink:0}
  /* 결과 페이지: 한 화면에 억지로 넣지 않고 자연스럽게 스크롤 */
  #page3.active{display:block}
  #page3 .page-head{margin-bottom:10px}
  #page3 .home-btn{margin-bottom:6px}
  /* 선택 슬롯: 빈 칸은 점선 원, 고르면 아이콘만 채워짐 */
  .slots{display:flex;gap:6px;flex-shrink:0}
  .slot{width:42px;height:42px;border-radius:50%;border:2px dashed var(--faint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .slot .ico{width:42px;height:42px}
  .slot.filled{border:none}
  .slot.none{border:2px solid var(--line);background:var(--surface2);color:var(--faint)}
  .slot.none svg{width:20px;height:20px}

  /* type icon badge — 실제 공식 타입 아이콘 이미지 (assets/type-*.png) */
  .ico{display:block;border-radius:50%;object-fit:contain;flex-shrink:0;-webkit-user-drag:none;user-select:none}

  /* type picker grid */
  .type-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,minmax(72px,1fr));gap:8px}
  @media(min-width:560px){.type-grid{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,minmax(72px,1fr))}}
  .type-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;color:var(--text);min-height:0;height:100%;overflow:hidden;padding:6px 2px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .08s, opacity .15s}
  .type-btn:active{transform:scale(.97)}
  .type-btn .ico{width:40px;height:40px;min-width:40px;min-height:40px;flex:none}
  .type-btn .tname{font-size:15px;font-weight:800;line-height:1.15;letter-spacing:-.01em;flex-shrink:0;padding-bottom:1px}
  .type-btn.selected{border-color:var(--text);outline:2px solid var(--text);outline-offset:-2px}
  /* page 2: 첫 번째로 고른 타입 버튼 위 오버레이 = 단일타입 선택 */
  .type-btn.is-first .ico,.type-btn.is-first .tname{opacity:.9}
  .single-overlay{position:absolute;inset:0;background:rgba(24,24,22,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:900;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
  @media (prefers-color-scheme: dark){.single-overlay{background:rgba(0,0,0,.52)}}
  .back-btn{align-self:flex-start;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;line-height:1.55;text-decoration:underline;text-underline-offset:3px;padding:3px 4px 0;height:24px;min-height:0;margin-top:0;display:inline-flex;align-items:flex-start;flex-shrink:0}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:13px;padding:3px 10px 3px 3px;min-height:30px}
  .chip .ico{width:24px;height:24px}
  .chip em{font-style:normal;font-weight:900;font-size:11.5px;background:var(--surface2);color:var(--text);border-radius:999px;padding:1px 6px}
  .chip.big{font-size:14px;min-height:34px;padding-right:12px}
  .chip.big .ico{width:28px;height:28px}

  /* results (page 3) */
  .home-btn{border:none;background:var(--text);color:var(--bg);border-radius:12px;padding:0 16px;font-size:15px;font-weight:900;min-height:50px;width:100%;margin-top:14px;flex-shrink:0}
  .groups{display:flex;flex-direction:column;gap:6px}
  .group{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow)}
  .mult-pill{font-size:12.5px;font-weight:900;color:#fff;border-radius:999px;padding:3px 0;line-height:1.4;width:52px;text-align:center;flex-shrink:0}
  .mult-pill.m4{background:#b42318}.mult-pill.m2{background:#e85d1a}.mult-pill.m05{background:#667085}.mult-pill.m025{background:#98a2b3}.mult-pill.m0{background:#1a1a18}
  @media (prefers-color-scheme: dark){.mult-pill.m0{background:#f2f1ec;color:#1a1a18}}
  .empty-note{background:var(--surface2);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);line-height:1.6;text-align:center}

  .reverse{margin-top:30px;min-height:0}
  .rev-head{margin:0 0 10px}
  .rev-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;letter-spacing:-.01em;margin:0;color:var(--text)}
  .rev-ico{width:30px;height:30px;border-radius:50%;background:var(--warn);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .rev-ico svg{width:17px;height:17px}
  .rrows{display:flex;flex-direction:column;gap:6px}
  .rrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
  .r-lead{display:inline-flex;flex-shrink:0}
  .r-lead .ico{width:46px;height:46px}
  .r-arrow{color:var(--warn);font-size:17px;font-weight:900;flex-shrink:0;line-height:1}
  .rrow .chips{flex:1;min-width:0}
  /* iPhone (incl. iPhone 17 ~402pt wide) — safe-area aware */
  .page{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .page::-webkit-scrollbar{display:none}
  @media (max-width:430px){
    .wrap{padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px))}
    .type-grid{gap:7px}
    .type-btn{border-radius:16px}
    .chip{font-size:13.5px}
    .group{padding:7px 8px}
  }
  @media (max-height:720px){
    .wrap{padding-top:calc(10px + env(safe-area-inset-top,0px))}
    .page-head h1,.page-head h2{font-size:19px}
    .type-btn .tname{font-size:13.5px}
    .type-grid{gap:6px}
    .reverse{margin-top:22px}
  }
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <!-- Page 1 : first type -->
  <section class="page active" id="page1">
    <div class="page-head">
      <div class="head-text">
        <h1>상대의 타입은?</h1>
        <p class="foot-note">상대 포켓몬의 방어 타입을 골라주세요.</p>
      </div>
      <div class="slots" id="slots1"></div>
    </div>
    <div class="type-grid" id="grid1"></div>
  </section>

  <!-- Page 2 : second type -->
  <section class="page" id="page2">
    <div class="page-head">
      <div class="head-text">
        <h2>두 번째 타입은?</h2>
        <button class="back-btn" id="backBtn" type="button">← 다시 고르기</button>
      </div>
      <div class="slots" id="slots2"></div>
    </div>
    <div class="type-grid" id="grid2"></div>
  </section>

  <!-- Page 3 : results -->
  <section class="page" id="page3">
    <div class="page-head">
      <h2>공격 배율 결과</h2>
      <div class="slots" id="slots3"></div>
    </div>
    <div class="groups" id="groups"></div>
    <div class="reverse">
      <div class="rev-head">
        <h3 class="rev-title"><span class="rev-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13.5"/><path d="M12 17.2h.01"/></svg></span>조심해야 할 기술 타입</h3>
      </div>
      <div class="rrows" id="reverseCards"></div>
    </div>
    <button class="home-btn" id="homeBtn" type="button">처음으로</button>
  </section>

</div>

<script>
var TYPES = [
  {k:'normal', ko:'노말', c:'#A8A77A', dark:false},
  {k:'fire', ko:'불꽃', c:'#E2261F', dark:false},
  {k:'water', ko:'물', c:'#6390F0', dark:false},
  {k:'electric', ko:'전기', c:'#F7D02C', dark:true},
  {k:'grass', ko:'풀', c:'#7AC74C', dark:false},
  {k:'ice', ko:'얼음', c:'#96D9D6', dark:true},
  {k:'fighting', ko:'격투', c:'#EE8130', dark:false},
  {k:'poison', ko:'독', c:'#A33EA1', dark:false},
  {k:'ground', ko:'땅', c:'#E2BF65', dark:true},
  {k:'flying', ko:'비행', c:'#A98FF3', dark:false},
  {k:'psychic', ko:'에스퍼', c:'#F95587', dark:false},
  {k:'bug', ko:'벌레', c:'#A6B91A', dark:false},
  {k:'rock', ko:'바위', c:'#B6A136', dark:false},
  {k:'ghost', ko:'고스트', c:'#735797', dark:false},
  {k:'dragon', ko:'드래곤', c:'#6F35FC', dark:false},
  {k:'dark', ko:'악', c:'#705746', dark:false},
  {k:'steel', ko:'강철', c:'#B7B7CE', dark:true},
  {k:'fairy', ko:'페어리', c:'#D685AD', dark:false}
];
var BY = {}; TYPES.forEach(function(t){ BY[t.k]=t; });

/* 타입 아이콘: 실제 공식 아이콘 이미지 (Bulbapedia SV 아이콘과 동일 규격의 게임 추출 원본, pokesprite gen8 세트) */
function icoBadge(t){
  return '<img class="ico" src="'+ICON_DATA[t.k]+'" alt="" draggable="false">';
}

/* 공격타입 -> {방어타입: 배율} , 없으면 1배 */
var CHART = {
  normal:{rock:0.5,ghost:0,steel:0.5},
  fire:{fire:0.5,water:0.5,grass:2,ice:2,bug:2,rock:0.5,dragon:0.5,steel:2},
  water:{fire:2,water:0.5,grass:0.5,ground:2,rock:2,dragon:0.5},
  electric:{water:2,electric:0.5,grass:0.5,ground:0,flying:2,dragon:0.5},
  grass:{fire:0.5,water:2,grass:0.5,poison:0.5,ground:2,flying:0.5,bug:0.5,rock:2,dragon:0.5,steel:0.5},
  ice:{fire:0.5,water:0.5,grass:2,ice:0.5,ground:2,flying:2,dragon:2,steel:0.5},
  fighting:{normal:2,ice:2,poison:0.5,flying:0.5,psychic:0.5,bug:0.5,rock:2,ghost:0,dark:2,steel:2,fairy:0.5},
  poison:{grass:2,poison:0.5,ground:0.5,rock:0.5,ghost:0.5,steel:0,fairy:2},
  ground:{fire:2,electric:2,grass:0.5,poison:2,flying:0,bug:0.5,rock:2,steel:2},
  flying:{electric:0.5,grass:2,fighting:2,bug:2,rock:0.5,steel:0.5},
  psychic:{fighting:2,poison:2,psychic:0.5,dark:0,steel:0.5},
  bug:{fire:0.5,grass:2,fighting:0.5,poison:0.5,flying:0.5,psychic:2,ghost:0.5,dark:2,steel:0.5,fairy:0.5},
  rock:{fire:2,ice:2,fighting:0.5,ground:0.5,flying:2,bug:2,steel:0.5},
  ghost:{normal:0,psychic:2,ghost:2,dark:0.5},
  dragon:{dragon:2,steel:0.5,fairy:0},
  dark:{fighting:0.5,psychic:2,ghost:2,dark:0.5,fairy:0.5},
  steel:{fire:0.5,water:0.5,electric:0.5,ice:2,rock:2,steel:0.5,fairy:2},
  fairy:{fire:0.5,fighting:2,poison:0.5,dragon:2,dark:2,steel:0.5}
};
function eff(atk, def){ var v = CHART[atk][def]; return v===undefined?1:v; }
function multVs(atk, defs){ var m=1; for(var i=0;i<defs.length;i++) m*=eff(atk,defs[i]); return m; }
function fmtShort(m){ return m===0?'0배':m+'배'; }

function defensiveProfile(defKey){
  var weak=[];
  TYPES.forEach(function(t){
    if(eff(t.k, defKey)===2) weak.push(t);
  });
  return {weak:weak};
}

var state = { page:1, first:null, second:undefined }; // second: undefined=미선택, null=없음, string=타입

function chipHTML(t, m, big){
  return '<span class="chip'+(big?' big':'')+'">'+icoBadge(t)+t.ko+(m!==undefined?'<em>'+fmtShort(m)+'</em>':'')+'</span>';
}

function buildGrid(el, isSecond){
  TYPES.forEach(function(t){
    var b=document.createElement('button');
    b.type='button'; b.className='type-btn'; b.dataset.k=t.k;
    b.setAttribute('aria-label', t.ko+' 타입');
    b.innerHTML = icoBadge(t)+'<span class="tname">'+t.ko+'</span>'
      + (isSecond ? '<span class="single-overlay hidden">단일타입</span>' : '');
    b.addEventListener('click', function(){
      if(isSecond){
        if(t.k===state.first){ state.second=null; } /* 오버레이(단일타입) 탭 */
        else state.second=t.k;
        state.page=3;
      }
      else { state.first=t.k; if(state.second===t.k) state.second=undefined; state.page=2; }
      render();
    });
    el.appendChild(b);
  });
}
buildGrid(document.getElementById('grid1'), false);
buildGrid(document.getElementById('grid2'), true);

document.getElementById('backBtn').addEventListener('click', function(){ state.page=1; render(); });
document.getElementById('homeBtn').addEventListener('click', function(){ state.first=null; state.second=undefined; state.page=1; render(); });

var NONE_SLOT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>';
function renderSlots(){
  var html = '<span class="slot'+(state.first?' filled':'')+'">'
      + (state.first ? icoBadge(BY[state.first]) : '') + '</span>';
  if(state.second===null){
    html += '<span class="slot none">'+NONE_SLOT_SVG+'</span>';
  } else {
    html += '<span class="slot'+(state.second?' filled':'')+'">'
      + (state.second ? icoBadge(BY[state.second]) : '') + '</span>';
  }
  ['slots1','slots2','slots3'].forEach(function(id){ document.getElementById(id).innerHTML = html; });
}

function render(){
  document.getElementById('page1').classList.toggle('active', state.page===1);
  document.getElementById('page2').classList.toggle('active', state.page===2);
  document.getElementById('page3').classList.toggle('active', state.page===3);

  renderSlots();

  document.querySelectorAll('#grid1 .type-btn').forEach(function(b){ b.classList.toggle('selected', b.dataset.k===state.first); });
  document.querySelectorAll('#grid2 .type-btn').forEach(function(b){
    var isFirst = b.dataset.k===state.first;
    b.classList.toggle('is-first', isFirst);
    var ov = b.querySelector('.single-overlay');
    if(ov) ov.classList.toggle('hidden', !isFirst);
  });

  if(state.page===3 && state.first){
    var defs = state.second ? [state.first, state.second] : [state.first];
    renderResults(defs);
  }
  var activePage = document.getElementById('page'+state.page);
  if(activePage) activePage.scrollTop = 0;
  window.scrollTo(0,0);
}

function renderResults(defs){
  var rows = TYPES.map(function(t){ return {t:t, m:multVs(t.k, defs)}; }).filter(function(r){ return r.m!==1; });
  var buckets = [
    {m:4, cls:'m4'},
    {m:2, cls:'m2'},
    {m:0.5, cls:'m05'},
    {m:0.25, cls:'m025'},
    {m:0, cls:'m0'}
  ];
  var html='';
  buckets.forEach(function(b){
    var items = rows.filter(function(r){ return r.m===b.m; });
    if(!items.length) return;
    html+='<div class="group"><span class="mult-pill '+b.cls+'">'+fmtShort(b.m)+'</span><div class="chips">'
      + items.map(function(r){ return chipHTML(r.t); }).join('') + '</div></div>';
  });
  if(!html) html='<div class="empty-note">모든 공격이 1배예요.</div>';
  document.getElementById('groups').innerHTML = html;

  /* 역방향: 약점 공격타입(2배/4배) 포켓몬을 데려갔을 때의 약점만 */
  var attackers = rows.filter(function(r){ return r.m>=2; }).sort(function(a,b){ return b.m-a.m; });
  var rc='';
  if(!attackers.length){
    rc='<div class="empty-note">2배 이상 약점 없음</div>';
  } else {
    attackers.forEach(function(r){
      var prof = defensiveProfile(r.t.k);
      var weakChips = prof.weak.map(function(w){ return chipHTML(w); }).join('');
      rc+='<div class="rrow"><span class="r-lead" role="img" aria-label="'+r.t.ko+' 타입">'+icoBadge(r.t)+'</span>'
        +'<span class="r-arrow" aria-hidden="true">→</span>'
        +'<div class="chips">'+(weakChips||'<span style="font-size:12px;color:var(--muted)">약점 없음</span>')+'</div>'
        +'</div>';
    });
  }
  document.getElementById('reverseCards').innerHTML = rc;
}

render();
</script>
</body>
</html>
